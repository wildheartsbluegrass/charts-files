<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<!-- Apache mod_autoindex ("Index of") directory listing — blank reusable template.
     Replace {{PATH}}, duplicate the file row per entry, and edit the footer. -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Index of {{PATH}}</title>
 </head>
 <body>
<h1>Index of {{PATH}}</h1>
  <table>
   <tbody><tr><th valign="top"><img src="./Apache Autoindex Template_files/blank.gif" alt="[ICO]"></th><th><a href="?C=N;O=D">Name</a></th><th><a href="?C=M;O=A">Last modified</a></th><th><a href="?C=S;O=A">Size</a></th><th><a href="?C=D;O=A">Description</a></th></tr>
   <tr><th colspan="5"><hr></th></tr>
<tr><td valign="top"><img src="./Apache Autoindex Template_files/back.gif" alt="[PARENTDIR]"></td><td><a href="../">Parent Directory</a></td><td>&nbsp;</td><td align="right">  - </td><td>&nbsp;</td></tr>
<!-- File row: copy once per entry -->
<tr><td valign="top"><img src="./Apache Autoindex Template_files/layout.gif" alt="[   ]"></td><td><a href="{{FILE_URL}}">{{FILE_NAME}}</a></td><td align="right">{{YYYY-MM-DD HH:MM}}  </td><td align="right">{{SIZE}}</td><td>&nbsp;</td></tr>
   <tr><th colspan="5"><hr></th></tr>
</tbody></table>
<address>Apache/2.4.66 (Ubuntu) Server at {{HOST}} Port 443</address>
</body></html>
